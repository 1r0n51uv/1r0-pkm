# Full backend stack for 1r0-pkm (ADR-0022): Postgres + the Fastify API +
# Caddy as TLS-terminating reverse proxy. Meant to run as-is on an AWS EC2
# instance (ADR-0009). Copy .env.example -> .env first.
#
#   docker compose up -d
#
name: 1r0-pkm

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Applied in filename order on FIRST init only (empty data dir).
      # These SQL files stay the schema source of truth (ADR-0022).
      - ../supabase/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: ../apps/api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      # ADR-0033/0034: due database, un solo container api. DATABASE_URL
      # (prod, PROD_DB_NAME) è il default; DATABASE_URL_DEV (POSTGRES_DB, il
      # database di bootstrap del container `db` — dati di sviluppo/test) si
      # usa per richiesta quando il client manda l'header `X-Db-Target: dev`
      # (interruttore in Impostazioni, db.js sceglie il pool per richiesta).
      # Entrambi vivono nello stesso Postgres/volume. Niente fallback
      # annidato qui: l'interpolazione di compose non supporta `${A:-${B}}`.
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${PROD_DB_NAME}
      DATABASE_URL_DEV: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      API_KEY: ${API_KEY}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-sonnet-5}
      USDA_API_KEY: ${USDA_API_KEY:-DEMO_KEY}
      PORT: "8080"
    expose:
      - "8080"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - api
    environment:
      API_DOMAIN: ${API_DOMAIN:-:80}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  pgdata:
  caddy_data:
  caddy_config:
